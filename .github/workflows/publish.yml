# Publishes the package to npm and attaches the skill zips when a GitHub release is published.
# npm trusted publishing: npm accepts the upload only from this workflow file in
# FaireDose/CHEPTA, so no npm token is stored anywhere, and it adds a provenance record.
# Configured on npmjs.com under Packages > chepta > Settings > Trusted publishing.
# Staged publishing: the workflow only *stages* the new version; it goes live when the
# maintainer approves it with two-factor authentication on npmjs.com (chepta > Staged
# Packages > Approve). See https://docs.npmjs.com/staged-publishing
# Each job gets only the permissions it needs. Actions are pinned to commit SHAs.
# The version comes from the release's tag (v0.5.0, 0.5.0 and the typo v.0.5.0 all mean 0.5.0): scripts/set-version.mjs
# writes it into package.json, the lock file, the README and every CDN link before the tests, so a release no longer
# fails because the version was not bumped by hand first; the last job writes it back to main (2026-10-29).
name: Publish to npm

on:
  release:
    types: [published]
  # "Run workflow" button (Actions tab): publishes from main the version typed in the box, or the one in package.json
  # when the box is empty, e.g. to retry a failed upload without making a new release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.5.0 (empty: the version in package.json)"
        required: false
        default: ""

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set the version from the release
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          RAW="${TAG:-$INPUT}"
          if [ -z "$RAW" ]; then RAW=$(node -p "require('./package.json').version"); fi
          node scripts/set-version.mjs "$RAW"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    permissions:
      contents: read     # to check out the code
      id-token: write    # for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # no registry-url: it writes an .npmrc that logs in with NODE_AUTH_TOKEN, the old token path;
      # trusted publishing logs in by OpenID Connect and needs no .npmrc (npm's default registry)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # staged publishing needs npm 11.15.0 or newer; trusted publishing npm 11.5.1 and Node 22.14.0
      - run: npm install -g npm@11
      - run: node --version && npm --version
      - name: Set the version from the release
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          RAW="${TAG:-$INPUT}"
          if [ -z "$RAW" ]; then RAW=$(node -p "require('./package.json').version"); fi
          node scripts/set-version.mjs "$RAW"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # npm never accepts a version twice: stop early with a clear message instead of an npm error.
      - name: Check the version is new
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          if [ "$(npm view "chepta@$V" version 2>/dev/null)" = "$V" ]; then
            echo "::error::chepta@$V is already on npm. Make a release with a higher version (for example the next patch number)."
            exit 1
          fi
      # Trusted publishing: npm checks this workflow by OpenID Connect; no token is used, and the version
      # is staged for approval on npmjs.com. The trusted publisher on npmjs.com (chepta > Settings) names
      # FaireDose, CHEPTA and publish.yml, exactly. The first upload of the package (0.3.0) used a one-day
      # token instead, because npm adds a trusted publisher only to a package that exists; that token and
      # its secret are deleted. --loglevel verbose: a failed OpenID Connect login says why in the log.
      - name: Stage the version on npm
        run: npm stage publish --provenance --access public --loglevel verbose

  # The version written back to main, so the repository says what npm has: pushed to main, or, where main does not
  # accept a push from the workflow, a pull request "Version x.y.z" for the maintainer to merge.
  sync:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the version to main
      pull-requests: write   # else to open the pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Write the version to main
        env:
          V: ${{ needs.npm.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/set-version.mjs "$V"
          if git diff --quiet; then echo "main already says $V"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $V (written by the publish workflow after staging chepta@$V)"
          if git push origin HEAD:main; then exit 0; fi
          git push origin "HEAD:refs/heads/version-$V"
          gh pr create --base main --head "version-$V" --title "Version $V" \
            --body "The publish workflow staged chepta@$V on npm. This writes the version into package.json, the lock file, the README and the CDN links (scripts/set-version.mjs). Merge it so main says what npm has."

  skills:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to attach the skill zips to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Attach the skills to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p skill-zips
          for d in ai/skills/*/; do
            n=$(basename "$d")
            (cd ai/skills && zip -qr "../../skill-zips/$n.zip" "$n")
          done
          gh release upload "$TAG" skill-zips/*.zip --clobber
