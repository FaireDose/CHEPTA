# Engineering report, step 2 of 2: posts one comment on the pull request (updated in place on
# every new push). It starts with the pull request's own "What this changes" and "Next steps"
# sections (the maintainer gets this comment by e-mail, so it says first what the change is and
# what comes next), followed by the report of engineering-report.yml, folded.
#
# workflow_run workflows run from the default branch with a token that can write, so this
# one is written to be safe with pull requests from forks:
# - it never checks out, installs or runs code from the pull request;
# - the token can only write pull-request comments and read workflow artifacts;
# - the artifact is untrusted data: it is read as text by JavaScript (never interpolated
#   into a shell command or an expression), the pull request number must be an integer,
#   and the pull request's current head commit must be the commit the report was made for;
# - @mentions in the report are neutralised and the comment is size-limited.
# This workflow only runs once it is on the default branch.
name: Engineering report comment

on:
  workflow_run:
    workflows: ["Engineering report"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download the report (untrusted data)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-report
          path: ${{ runner.temp }}/engineering-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_DIR: ${{ runner.temp }}/engineering-report
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const MARKER = "<!-- chepta-engineering-report -->";
            const MAX = 64000;
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Read a regular file of the artifact as text, with a size limit.
            const read = (name, limit) => {
              const p = path.join(process.env.REPORT_DIR, name);
              const st = fs.lstatSync(p);
              if (!st.isFile()) throw new Error(`${name} is not a regular file`);
              if (st.size > limit) throw new Error(`${name} is too large (${st.size} bytes)`);
              return fs.readFileSync(p, "utf8");
            };

            // 1. The pull request number: an integer, and the pull request's head must be
            //    the commit the report was computed for.
            const raw = read("pr_number.txt", 64).trim();
            if (!/^[0-9]{1,9}$/.test(raw)) {
              core.setFailed("pr_number.txt does not hold a pull request number");
              return;
            }
            const number = Number(raw);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.sha !== run.head_sha) {
              core.notice(`Pull request #${number} is at ${pr.head.sha}, the report is for ${run.head_sha}: not posting.`);
              return;
            }
            if (pr.head.repo?.full_name !== run.head_repository?.full_name) {
              core.setFailed("The report's repository does not match the pull request's head repository.");
              return;
            }
            if (pr.state !== "open") {
              core.notice(`Pull request #${number} is ${pr.state}: not posting.`);
              return;
            }

            // 2. Untrusted Markdown (the report, the pull request's description): remove our marker,
            //    neutralise @mentions, cap the size.
            const clean = (t, max) => {
              let out = String(t ?? "").split(MARKER).join("").replace(/@(?=[A-Za-z0-9_-])/g, "@​");
              return out.length > max ? out.slice(0, max) + "\n\n*(truncated)*" : out;
            };
            // A "## Title" section of the description (up to the next "## " heading), without HTML comments.
            const section = title => {
              const lines = String(pr.body ?? "").replace(/\r\n/g, "\n").replace(/<!--[\s\S]*?-->/g, "").split("\n");
              const start = lines.findIndex(l => l.trim().toLowerCase() === `## ${title}`.toLowerCase());
              if (start < 0) return "";
              const end = lines.findIndex((l, i) => i > start && /^## /.test(l));
              return lines.slice(start + 1, end < 0 ? undefined : end).join("\n").trim();
            };
            const what = clean(section("What this changes"), 20000);
            const next = clean(section("Next steps"), 8000);
            const report = clean(read("report.md", 1024 * 1024), MAX);
            const head = [
              `## #${number}: ${clean(pr.title, 300)}`,
              what ? `### What this changes\n\n${what}` : "",
              next ? `### Next steps\n\n${next}` : "",
            ].filter(Boolean).join("\n\n");
            const footer = `\n\n---\n<sub>Full report with plots: open [the workflow run](${run.html_url}) and download ` +
              `the \`engineering-report\` artifact (\`report.html\`). Computed for commit ${run.head_sha.slice(0, 7)}.</sub>\n`;
            const text = `${MARKER}\n${head}\n\n<details>\n<summary><b>Engineering report</b>: the fixed cases computed ` +
              `with this pull request and with the base branch, against the references</summary>\n\n${report}\n\n</details>${footer}`;

            // 3. One comment per pull request, found by the marker and updated in place.
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.startsWith(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
              core.info(`Updated comment ${mine.id} on #${number}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
              core.info(`Commented on #${number}`);
            }
